<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, sans-serif;
      color: #172033;
      background: #f3f6fb;
    }

    .login-card {
      width: min(100%, 400px);
      padding: 36px;
      border: 1px solid #e4e9f1;
      border-radius: 16px;
      background: white;
      box-shadow: 0 16px 40px rgb(22 34 55 / 8%);
    }

    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    .subtitle { margin: 0 0 28px; color: #667085; }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cfd7e3;
      border-radius: 8px;
      font: inherit;
    }

    input:focus {
      outline: 3px solid #cfe0ff;
      border-color: #3267d6;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 16px 0 22px;
      font-size: 0.9rem;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .remember input { width: auto; }
    a { color: #285dcc; text-decoration: none; }
    a:hover { text-decoration: underline; }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      color: white;
      background: #285dcc;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #1e4eae; }
    #message { min-height: 1.5em; margin: 16px 0 0; color: #667085; }
    .signup { margin: 22px 0 0; text-align: center; color: #667085; }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your account to continue.</p>

    <form id="login-form">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email"
             placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" placeholder="Enter your password" required>

      <div class="options">
        <label class="remember">
          <input type="checkbox" name="remember">
          Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit">Sign in</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <p class="signup">Don't have an account? <a href="#">Sign up</a></p>
  </main>

  <script>
    document.querySelector("#login-form").addEventListener("submit", (event) => {
      event.preventDefault();
      document.querySelector("#message").textContent =
        "Demo only — connect this form to your authentication service.";
    });
  </script>
</body>
</html>
